schema: '2.0'
stages:
  prepare_data:
    cmd: python code/datasets/prepare_data.py --input data/raw/penguins.csv 
      --train-output data/processed/train.csv --test-output 
      data/processed/test.csv --test-size 0.2 --random-state 42 --iqr-factor 1.5
