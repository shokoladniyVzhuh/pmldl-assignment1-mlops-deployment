name: ${COMPOSE_PROJECT_NAME:-pmldl-assignment1}

services:
  api:
    build:
      context: ../..
      dockerfile: code/deployment/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: ../..
      dockerfile: code/deployment/app/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "${APP_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
